# xdpfw kural dosyasi
#
# Sozdizimi:
#   block ip   <ipv4>[/prefix]     kaynak IP veya CIDR blogu
#   block port <tcp|udp> <port>    hedef port
#
# Bos satirlar ve # ile baslayan satirlar atlanir.
# Yeniden yuklemek icin: sudo ./xdpfw reload rules.conf

# --- Ornek IP kurallari ---
block ip 192.168.100.0/24

# --- Ornek port kurallari ---
block port tcp 9999
block port udp 53
block ip 10.10.0.2
