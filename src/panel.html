<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>xdpfw paneli</title>
<style>
:root { --bg:#0f1419; --card:#1a212b; --line:#2a3441; --fg:#d5dae1; --dim:#7c8b9d;
        --ok:#4ec9a0; --warn:#e0a458; --bad:#e05d5d; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,sans-serif; padding:24px; }
h1 { font-size:18px; font-weight:500; margin-bottom:4px; }
.mod { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px;
       background:var(--line); color:var(--dim); }
.mod.wl { background:#3a2a1a; color:var(--warn); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:20px 0; }
.kart { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
.kart .etiket { font-size:12px; color:var(--dim); }
.kart .deger { font-size:24px; font-weight:500; margin-top:4px; font-variant-numeric:tabular-nums; }
.kart .pps { font-size:12px; color:var(--dim); }
.kart.drop .deger { color:var(--bad); }
.kart.pass .deger { color:var(--ok); }
.alt { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
section h2 { font-size:13px; font-weight:500; color:var(--dim); margin-bottom:10px;
             text-transform:uppercase; letter-spacing:.5px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th { text-align:left; font-weight:400; color:var(--dim); font-size:12px;
     border-bottom:1px solid var(--line); padding:4px 0; }
td { padding:5px 0; border-bottom:1px solid rgba(42,52,65,.4); }
td.n { text-align:right; }
.bos { color:var(--dim); font-size:13px; padding:8px 0; }

.grafikler { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin:20px 0; }
.grafik-kutu { background:var(--card); border:1px solid var(--line);
               border-radius:8px; padding:16px; }
.grafik-kutu h2 { font-size:13px; font-weight:500; color:var(--dim);
                  margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
.efsane { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-top:10px; }
.efsane span { display:flex; align-items:center; gap:5px; color:var(--dim); }
.nokta { width:9px; height:9px; border-radius:2px; display:inline-block; }
svg { display:block; width:100%; }
#halka { max-width:200px; margin:0 auto; }
@media(max-width:800px){ .grafikler{grid-template-columns:1fr} }

#log-kutu { margin-top:16px; }
#log { font-family:ui-monospace,'Cascadia Code',monospace; font-size:12px;
       max-height:260px; overflow-y:auto; }
#log div { padding:3px 0; border-bottom:1px solid rgba(42,52,65,.4);
           display:flex; gap:10px; align-items:baseline; }
#log .zaman { color:var(--dim); flex:0 0 88px; }
#log .kaynak { color:var(--fg); flex:0 0 130px; }
#log .hedef { color:var(--dim); flex:0 0 90px; }
#log .sebep { color:var(--bad); font-size:11px; padding:1px 7px;
              border:1px solid rgba(224,93,93,.35); border-radius:10px; }
#log .bos { color:var(--dim); border:none; }
.canli { display:inline-block; width:7px; height:7px; border-radius:50%;
         background:var(--bad); margin-left:8px; animation:nabiz 1.4s infinite; }
@keyframes nabiz { 0%,100%{opacity:1} 50%{opacity:.25} }
footer { margin-top:20px; font-size:12px; color:var(--dim); }
@media(max-width:700px){ .alt{grid-template-columns:1fr} }
</style>
</head>
<body>

<h1>xdpfw <span id="mod" class="mod">-</span></h1>

<div class="grid" id="kartlar"></div>

<div class="grafikler">
  <div class="grafik-kutu">
    <h2>Son 60 saniye (paket/sn)</h2>
    <svg id="cizgi" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
    <div class="efsane">
      <span><i class="nokta" style="background:#4ec9a0"></i>geçen</span>
      <span><i class="nokta" style="background:#e05d5d"></i>düşen</span>
    </div>
  </div>
  <div class="grafik-kutu">
    <h2>Protokol dağılımı</h2>
    <svg id="halka" viewBox="0 0 200 200"></svg>
    <div class="efsane" id="halka-efsane"></div>
  </div>
</div>

<div class="alt">
  <section>
    <h2 id="kural-baslik">Kurallar</h2>
    <table><thead><tr><th>Kural</th><th class="n">Eşleşme</th></tr></thead>
    <tbody id="kurallar"></tbody></table>
  </section>
  <section>
    <h2>En çok paket gönderenler</h2>
    <table><thead><tr><th>Kaynak IP</th><th class="n">Paket</th></tr></thead>
    <tbody id="talkers"></tbody></table>
  </section>
</div>

<section id="log-kutu">
  <h2>Canlı drop olayları<span class="canli" id="canli"></span></h2>
  <div id="log"><div class="bos">bağlantı bekleniyor…</div></div>
</section>

<footer id="durum">bağlanıyor…</footer>

<script>
let onceki = null;
const gecmis = { pass: [], drop: [] };   // son 60 saniyelik delta
const PROTO_RENK = { tcp:'#4ec9a0', udp:'#e0a458', icmp:'#5b9bd5', other:'#7c8b9d' };

function cizgiCiz(){
  const svg = document.getElementById('cizgi');
  const G = 600, Y = 160, n = 60;
  const tumu = gecmis.pass.concat(gecmis.drop);
  const max = Math.max(10, ...tumu);

  // izgara cizgileri
  let ic = '';
  for (let i = 0; i <= 4; i++){
    const y = Y * i / 4;
    ic += `<line x1="0" y1="${y}" x2="${G}" y2="${y}" stroke="#2a3441" stroke-width="1"/>`;
  }

  const yol = (dizi, renk) => {
    if (!dizi.length) return '';
    const noktalar = dizi.map((v, i) => {
      const x = G * i / (n - 1);
      const y = Y - (Y - 8) * v / max;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<polyline points="${noktalar}" fill="none" stroke="${renk}"
             stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  };

  ic += yol(gecmis.pass, '#4ec9a0');
  ic += yol(gecmis.drop, '#e05d5d');
  ic += `<text x="4" y="12" fill="#7c8b9d" font-size="11">${max.toLocaleString('tr-TR')}</text>`;
  svg.innerHTML = ic;
}

function halkaCiz(s){
  const svg = document.getElementById('halka');
  const veri = [
    ['tcp',   s.tcp   || 0],
    ['udp',   s.udp   || 0],
    ['icmp',  s.icmp  || 0],
    ['other', s.other || 0],
  ].filter(x => x[1] > 0);

  const toplam = veri.reduce((a, x) => a + x[1], 0);
  const cx = 100, cy = 100, r = 70, kalinlik = 26;

  if (!toplam){
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
                      stroke="#2a3441" stroke-width="${kalinlik}"/>`;
    document.getElementById('halka-efsane').innerHTML = '';
    return;
  }

  const cevre = 2 * Math.PI * r;
  let kayma = 0, ic = '', efsane = '';

  veri.forEach(([ad, deger]) => {
    const oran = deger / toplam;
    const uzunluk = cevre * oran;
    ic += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
            stroke="${PROTO_RENK[ad]}" stroke-width="${kalinlik}"
            stroke-dasharray="${uzunluk.toFixed(2)} ${(cevre - uzunluk).toFixed(2)}"
            stroke-dashoffset="${(-kayma).toFixed(2)}"
            transform="rotate(-90 ${cx} ${cy})"/>`;
    efsane += `<span><i class="nokta" style="background:${PROTO_RENK[ad]}"></i>
               ${ad.toUpperCase()} ${(oran * 100).toFixed(0)}%</span>`;
    kayma += uzunluk;
  });

  ic += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="#d5dae1"
          font-size="22" font-weight="500">${toplam.toLocaleString('tr-TR')}</text>`;
  ic += `<text x="${cx}" y="${cy + 14}" text-anchor="middle" fill="#7c8b9d"
          font-size="11">paket</text>`;

  svg.innerHTML = ic;
  document.getElementById('halka-efsane').innerHTML = efsane;
}

function say(n){ return n.toLocaleString('tr-TR'); }

function kart(etiket, deger, pps, sinif){
  return `<div class="kart ${sinif||''}">
    <div class="etiket">${etiket}</div>
    <div class="deger">${say(deger)}</div>
    <div class="pps">${pps!==null ? say(pps)+' pkt/sn' : '&nbsp;'}</div>
  </div>`;
}

async function guncelle(){
  let d;
  try {
    const r = await fetch('/api/stats');
    d = await r.json();
  } catch(e) {
    document.getElementById('durum').textContent = 'bağlantı yok';
    return;
  }

  const s = d.stats || {};
  const wl = d.mode === 'whitelist';

  const m = document.getElementById('mod');
  m.textContent = d.mode;
  m.className = 'mod' + (wl ? ' wl' : '');

  const delta = k => onceki ? Math.max(0, (s[k]||0) - (onceki[k]||0)) : null;

  document.getElementById('kartlar').innerHTML =
      kart('Toplam paket', s.total||0, delta('total')) +
      kart('Geçen', s.passed||0, delta('passed'), 'pass') +
      kart('Düşürülen', s.dropped||0, delta('dropped'), 'drop') +
      kart('TCP', s.tcp||0, delta('tcp')) +
      kart('UDP', s.udp||0, delta('udp')) +
      kart('ICMP', s.icmp||0, delta('icmp'));

  document.getElementById('kural-baslik').textContent =
      wl ? 'İzinli kaynaklar' : 'Engelli kurallar';

  const satirlar = [];
  (d.ips||[]).forEach(x => satirlar.push(
      `<tr><td>${x.cidr}</td><td class="n">${say(x.hits)}</td></tr>`));
  (d.ports||[]).forEach(x => satirlar.push(
      `<tr><td>${x.proto}/${x.port}</td><td class="n">${say(x.hits)}</td></tr>`));
  document.getElementById('kurallar').innerHTML =
      satirlar.length ? satirlar.join('') : '<tr><td colspan="2" class="bos">kural yok</td></tr>';

  const t = (d.talkers||[]).map(x =>
      `<tr><td>${x.ip}</td><td class="n">${say(x.packets)}</td></tr>`);
  document.getElementById('talkers').innerHTML =
      t.length ? t.join('') : '<tr><td colspan="2" class="bos">kayıt yok</td></tr>';

  document.getElementById('durum').textContent =
      'son güncelleme ' + new Date().toLocaleTimeString('tr-TR');

  // gecmis dizilerini guncelle (60 nokta)
  if (onceki){
    gecmis.pass.push(Math.max(0, (s.passed||0) - (onceki.passed||0)));
    gecmis.drop.push(Math.max(0, (s.dropped||0) - (onceki.dropped||0)));
    if (gecmis.pass.length > 60) gecmis.pass.shift();
    if (gecmis.drop.length > 60) gecmis.drop.shift();
  }
  cizgiCiz();
  halkaCiz(s);

  onceki = s;
}


// --- SSE: canli drop olay akisi ---
const logEl = document.getElementById('log');
let ilkOlay = true;

function olayEkle(o){
  if (ilkOlay){ logEl.innerHTML = ''; ilkOlay = false; }

  const d = document.createElement('div');
  const hedef = o.dport ? `${o.proto}/${o.dport}` : o.proto;
  const sn = (o.ts % 86400).toFixed(3);

  d.innerHTML = `<span class="zaman">${sn}</span>` +
                `<span class="kaynak">${o.src}</span>` +
                `<span class="hedef">${hedef}</span>` +
                `<span class="sebep">${o.reason}</span>`;

  logEl.prepend(d);
  while (logEl.children.length > 100) logEl.lastChild.remove();
}

function sseBaglan(){
  const es = new EventSource('/api/events');

  es.onmessage = e => {
    try { olayEkle(JSON.parse(e.data)); } catch(x){}
  };
  es.onerror = () => {
    document.getElementById('canli').style.background = 'var(--dim)';
    es.close();
    setTimeout(sseBaglan, 3000);   // yeniden baglan
  };
  es.onopen = () => {
    document.getElementById('canli').style.background = 'var(--bad)';
  };
}

guncelle();
setInterval(guncelle, 1000);
sseBaglan();
</script>
</body>
</html>
